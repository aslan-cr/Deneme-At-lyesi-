<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Deneme Atölyesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#3d5afe;--ac2:#e8ecff;--ok:#1b9e5a;--no:#d6403a;--bd:#e2ded2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#eef0f6;--mu:#9aa3b8;--ac:#7c93ff;--ac2:#252c4a;--ok:#3ecf8e;--no:#ff7a72;--bd:#2c3348}}
*{box-sizing:inherit}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 Georgia,serif;margin:8px 0 2px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:80px;text-align:center;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:600 16px inherit;cursor:pointer}
.chip.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.sub{font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tp{display:inline-block;margin:4px 4px 0 0;padding:6px 10px;border-radius:99px;border:1px solid var(--bd);font-size:14px;cursor:pointer;color:var(--mu);background:transparent}
.tp.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.main{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:700 17px inherit;cursor:pointer;margin-top:6px}
button.main:disabled{opacity:.5}button.lnk{background:none;border:0;color:var(--ac);font:600 14px inherit;cursor:pointer;padding:4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:16px inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:14px}.big{font:700 48px Georgia,serif}.tag{font-size:12px;color:var(--ac);font-weight:700}
.ex{margin-top:8px;padding:10px;border-radius:10px;background:var(--ac2);font-size:14px}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
</style></head><body><main id="app"></main>
<script>
const D={
6:{"Matematik":["Doğal sayılarla işlemler|Çarpanlar ve katlar|Kümeler|Tam sayılar","Kesirlerle işlemler|Ondalık gösterim|Oran|Cebirsel ifadeler|Veri analizi|Açılar|Alan ölçme"],
"Türkçe":["Sözcükte anlam|Cümlede anlam|Paragraf|Yazım kuralları","Noktalama işaretleri|Fiiller|Metin türleri|Söz sanatları"],
"Fen Bilimleri":["Güneş Sistemi ve tutulmalar|Vücudumuzdaki sistemler|Kuvvet ve hareket","Madde ve ısı|Ses|Işık|Elektrik"],
"Sosyal Bilgiler":["Biz ve değerlerimiz|Tarihe yolculuk|Yeryüzünde yaşam","Ülkemizin nüfusu|İpek Yolu’nda hayat|Teknoloji ve iletişim"],
"İngilizce":["Life|Yummy Breakfast|Downtown|Weather and Emotions","At the Fair|Occupations|Holidays|Bookworms"]},
7:{"Matematik":["Tam sayılarla işlemler|Rasyonel sayılar|Cebirsel ifadeler|Eşitlik ve denklem","Oran ve orantı|Yüzdeler|Doğrular ve açılar|Çember ve daire|Veri analizi"],
"Türkçe":["Fiilimsiler|Anlatım biçimleri|Paragraf|Yazım kuralları","Ek fiil|Sözcük türleri|Metin türleri|Söz sanatları"],
"Fen Bilimleri":["Güneş Sistemi ve ötesi|Hücre ve bölünmeler|Kuvvet ve enerji","Saf maddeler ve karışımlar|Işığın madde ile etkileşimi|Canlılarda üreme|Elektrik devreleri"],
"Sosyal Bilgiler":["İletişim ve insan ilişkileri|Türklerin Anadolu’ya yolculuğu|Ülkemizin kaynakları","Osmanlı Devleti’nin kuruluşu|Ekonomi ve sosyal hayat|Zaman içinde bilim|Yaşayan demokrasi"],
"İngilizce":["Appearance and Personality|Sports|Biographies|Wild Animals","Television|Celebrations|Dreams|Public Buildings"]},
8:{"Matematik":["Çarpanlar ve katlar|Üslü ifadeler|Kareköklü ifadeler|Veri analizi|Olasılık","Cebirsel ifadeler ve özdeşlikler|Doğrusal denklemler|Eşitsizlikler|Üçgenler|Eşlik ve benzerlik|Dönüşüm geometrisi|Geometrik cisimler"],
"Türkçe":["Fiilimsiler|Cümlenin ögeleri|Paragraf|Yazım ve noktalama","Cümle türleri|Anlatım bozuklukları|Söz sanatları|Metin türleri"],
"Fen Bilimleri":["Mevsimler ve iklim|DNA ve genetik kod|Basınç","Madde ve endüstri|Basit makineler|Enerji dönüşümleri ve çevre bilimi|Elektrik yükleri"],
"T.C. İnkılap Tarihi":["Bir kahraman doğuyor|Milli uyanış|Milli bir destan","Atatürkçülük ve çağdaşlaşan Türkiye|Demokratikleşme çabaları|Atatürk dönemi dış politika|Atatürk sonrası dönem"],
"İngilizce":["Friendship|Teen Life|In the Kitchen|On the Phone","The Internet|Adventures|Tourism|Chores|Science"]}};
const now=new Date(),m=now.getMonth()+1,Y=now.getFullYear(),SY=m>=9?Y+"-"+(Y+1):(Y-1)+"-"+Y;
let S={g:6,t:(m>=9||m===1)?1:2,sel:{},n:5,q:[],i:0,ans:[],pick:null,t0:0,asked:[],topics:null};
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function curr(){const src=S.topics&&S.topics[S.g]||D[S.g];return src}
function hist(){try{return JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){return[]}}
function saveHist(r){try{const h=hist();h.unshift(r);localStorage.setItem("hist",JSON.stringify(h.slice(0,15)))}catch(e){}}
function setup(){
 const c=curr(),subs=Object.keys(c);
 app.innerHTML=`<h1>Deneme Atölyesi</h1><div class="mu">${SY} eğitim yılı · her denemede yeni sorular</div>
 <h2>Sınıf</h2><div class="row">${[6,7,8].map(g=>`<button class="chip ${S.g==g?"on":""}" data-g="${g}">${g}. Sınıf</button>`).join("")}</div>
 <h2>Dönem</h2><div class="row">${[1,2].map(t=>`<button class="chip ${S.t==t?"on":""}" data-t="${t}">${t}. Dönem</button>`).join("")}</div>
 <h2>Dersler ve konular</h2>
 ${subs.map(s=>{const ts=c[s][S.t-1].split("|"),on=S.sel[s]||[];return `<div class="card"><div class="sub"><span>${esc(s)}</span><button class="lnk" data-all="${esc(s)}">${on.length==ts.length?"Temizle":"Tümü"}</button></div>${ts.map(t=>`<button class="tp ${on.includes(t)?"on":""}" data-s="${esc(s)}" data-tp="${esc(t)}">${esc(t)}</button>`).join("")}</div>`}).join("")}
 <h2>Ders başına soru sayısı</h2><select id="n">${[3,5,8,10].map(n=>`<option ${S.n==n?"selected":""}>${n}</option>`).join("")}</select>
 <button class="main" id="go">Denemeyi başlat</button>
 <button class="lnk" id="ref">↻ ${SY} konularını yapay zekâyla güncelle</button>
 ${histHtml()}`;
 app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.g=+b.dataset.g;S.sel={};setup()});
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.t=+b.dataset.t;S.sel={};setup()});
 app.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{const s=b.dataset.s,t=b.dataset.tp,a=S.sel[s]||(S.sel[s]=[]);const i=a.indexOf(t);i<0?a.push(t):a.splice(i,1);setup()});
 app.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const s=b.dataset.all,ts=c[s][S.t-1].split("|");S.sel[s]=(S.sel[s]||[]).length==ts.length?[]:ts;setup()});
 $("#n").onchange=e=>S.n=+e.target.value;
 $("#go").onclick=start;$("#ref").onclick=refresh;
}
function histHtml(){const h=hist();if(!h.length)return"";return`<h2>Son denemeler</h2>`+h.slice(0,5).map(r=>`<div class="card"><b>${r.g}. sınıf · ${r.t}. dönem</b> — ${r.ok}/${r.tot} (%${Math.round(100*r.ok/r.tot)})<div class="mu">${esc(r.d)} · ${esc(r.by)}</div></div>`).join("")}
async function ai(){try{return await claude.use("sample")}catch(e){return null}}
async function refresh(){
 const sm=await ai();if(!sm)return alert("Yapay zekâ bu görünümde kullanılamıyor.");
 const b=$("#ref");b.textContent="Güncelleniyor…";
 try{const r=await sm.json(`Türkiye MEB ${SY} eğitim yılı müfredatına göre ${S.g}. sınıf için şu derslerin 1. ve 2. dönem ünite/konu listesini ver: ${Object.keys(D[S.g]).join(", ")}. Sadece JSON döndür: {"Ders adı":[["konu1","konu2"],["konu1","konu2"]]} (ilk dizi 1. dönem, ikinci dizi 2. dönem; her dönem 3-7 konu).`);
  const n={};for(const s of Object.keys(D[S.g])){if(r[s]&&r[s].length==2)n[s]=r[s].map(a=>a.join("|"));else n[s]=D[S.g][s]}
  S.topics=S.topics||{};S.topics[S.g]=n;S.sel={}}catch(e){alert("Güncellenemedi, mevcut liste kullanılıyor.")}
 setup()}
function mathFallback(n){const o=[];for(let k=0;k<n;k++){const a=2+rnd(18),b=2+rnd(18),c=2+rnd(9),ty=rnd(4);let q,r,e;
 if(ty==0){r=a*b+c;q=`${a} × ${b} + ${c} işleminin sonucu kaçtır?`;e=`${a}×${b}=${a*b}, üstüne ${c} eklenir.`}
 else if(ty==1){r=a*10;q=`x + ${b} = ${a*10+b} denkleminde x kaçtır?`;e=`x = ${a*10+b} − ${b}`}
 else if(ty==2){r=Math.round(c*b*5);q=`${b*10}’un %${c*5}’i kaçtır?`.replace(/’un|’in/,"’un");r=b*10*c*5/100;e="Yüzde = sayı × oran / 100"}
 else{r=a*a;q=`${a}² kaçtır?`;e=`${a} × ${a} = ${a*a}`}
 const w=new Set([r]);while(w.size<4)w.add(Math.max(0,r+rnd(11)-5||r+7));const op=[...w].map(String);
 o.push({s:"Matematik",t:"Genel",q,o:op,a:op.indexOf(String(r)),e})}return o}
async function start(){
 const subs=Object.keys(S.sel).filter(s=>S.sel[s].length);
 if(!subs.length)return alert("En az bir dersten konu seç.");
 app.innerHTML=`<h1>Sorular hazırlanıyor…</h1><div class="mu">Seçtiğin konulara özel, her seferinde yeni sorular üretiliyor.</div><div class="bar"><i style="width:40%"></i></div>`;
 let qs=[];const sm=await ai();
 try{
  if(!sm)throw 0;
  const seed=Math.random().toString(36).slice(2,8);
  const req=subs.map(s=>`- ${s}: ${S.n} soru, konular: ${S.sel[s].join("; ")}`).join("\n");
  const r=await sm.json(`Sen deneyimli bir Türkiye ortaokul öğretmenisin. ${S.g}. sınıf, ${S.t}. dönem, MEB ${SY} müfredatına uygun, LGS tarzı yeni nesil dört şıklı çoktan seçmeli sorular yaz. Rastgelelik tohumu: ${seed}. Her ders için seçilen konulara dengeli dağıt; bazıları paragraf/grafik/günlük hayat senaryosu içersin; kolay-orta-zor karışık olsun; doğru şık konumu rastgele olsun; çeldiriciler yaygın hataları yansıtsın. Daha önce sorulanlarla aynı veya benzer olmasın: ${JSON.stringify(S.asked.slice(-40))}.\n${req}\nSadece JSON dizisi döndür: [{"s":"ders","t":"konu","q":"soru","o":["A","B","C","D"],"a":doğruIndeks0-3,"e":"kısa çözüm açıklaması"}]`);
  qs=r.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length==4&&x.a>=0&&x.a<4);
 }catch(e){qs=subs.includes("Matematik")?mathFallback(S.n):[]}
 if(!qs.length){alert("Soru üretilemedi. Tekrar dene.");return setup()}
 qs=qs.map(x=>{const c=x.o[x.a],o=shuf(x.o);return{...x,o,a:o.indexOf(c)}});
 S.asked.push(...qs.map(x=>x.q.slice(0,50)));
 S.q=qs;S.i=0;S.ans=[];S.pick=null;S.t0=Date.now();quiz()}
function quiz(){
 const q=S.q[S.i],done=S.pick!==null;
 app.innerHTML=`<div class="mu">${S.i+1} / ${S.q.length} · <span id="tm"></span></div><div class="bar"><i style="width:${100*S.i/S.q.length}%"></i></div>
 <div class="card"><div class="tag">${esc(q.s)} · ${esc(q.t||"")}</div><p>${esc(q.q)}</p>
 ${q.o.map((o,i)=>`<button class="opt ${done?(i==q.a?"ok":i==S.pick?"no":""):""}" data-i="${i}" ${done?"disabled":""}>${"ABCD"[i]}) ${esc(o)}</button>`).join("")}
 ${done?`<div class="ex">${S.pick==q.a?"✓ Doğru. ":"✗ Yanlış. "}${esc(q.e||"")}</div>`:""}</div>
 ${done?`<button class="main" id="nx">${S.i+1<S.q.length?"Sonraki soru":"Sonucu gör"}</button>`:""}`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.pick=+b.dataset.i;S.ans.push(S.pick);quiz()});
 if($("#nx"))$("#nx").onclick=()=>{S.pick=null;S.i++;S.i<S.q.length?quiz():result()};
 tick()}
let tmr;function tick(){clearInterval(tmr);const f=()=>{const e=$("#tm");if(!e)return clearInterval(tmr);const s=Math.floor((Date.now()-S.t0)/1000);e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};f();tmr=setInterval(f,1000)}
function result(){
 clearInterval(tmr);const by={};let ok=0;
 S.q.forEach((q,i)=>{const b=by[q.s]||(by[q.s]={o:0,t:0});b.t++;if(S.ans[i]==q.a){b.o++;ok++}});
 const tot=S.q.length;saveHist({g:S.g,t:S.t,ok,tot,d:new Date().toLocaleDateString("tr-TR"),by:Object.keys(by).join(", ")});
 const wr=S.q.map((q,i)=>({q,i})).filter(x=>S.ans[x.i]!=x.q.a);
 app.innerHTML=`<div class="card" style="text-align:center"><div class="mu">Sonuç</div><div class="big">${ok}/${tot}</div><div>%${Math.round(100*ok/tot)} başarı · ${Math.round((Date.now()-S.t0)/60000)||1} dk</div></div>
 <h2>Ders bazında</h2>${Object.entries(by).map(([s,b])=>`<div class="card"><div class="sub"><span>${esc(s)}</span><span>${b.o}/${b.t}</span></div><div class="bar"><i style="width:${100*b.o/b.t}%"></i></div></div>`).join("")}
 ${wr.length?`<h2>Yanlışların</h2>`+wr.map(x=>`<div class="card"><div class="tag">${esc(x.q.s)} · ${esc(x.q.t||"")}</div><p>${esc(x.q.q)}</p><div class="mu">Senin cevabın: ${esc(x.q.o[S.ans[x.i]])}</div><div class="mu">Doğru: <b>${esc(x.q.o[x.q.a])}</b></div><div class="ex">${esc(x.q.e||"")}</div></div>`).join(""):"<div class='card'>Hepsi doğru, harika! 🎉</div>"}
 <button class="main" id="again">Yeni deneme (yeni sorular)</button><button class="lnk" id="home">Ana ekrana dön</button>`;
 $("#again").onclick=start;$("#home").onclick=setup}
setup();
</script></body></html>
