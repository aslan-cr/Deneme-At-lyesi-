# SkyNav (aslan-cr/kilit/skynav) Windows derlemesi: kurulum dosyası (SkyNav-Setup.exe) + taşınabilir zip.
name: SkyNav Windows
on:
  push:
    branches: [ccr-75415aef-qqitct]
    paths: ['.github/workflows/skynav-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # windows-latest = VS 2026; Flutter 3.35.7 yalnızca VS 2019/2022'yi tanıyor
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aslan-cr/kilit
          ref: main
          path: kilit
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Windows iskeleti ve derleme
        working-directory: kilit/skynav
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name skynav --org com.skynav .
          # Telefon gibi dik pencere
          (Get-Content windows\runner\main.cpp) -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(440, 920)' | Set-Content windows\runner\main.cpp
          Select-String -Path windows\runner\main.cpp -Pattern 'Size size'
          flutter pub get
          flutter build windows --release
      - name: Paketle (zip + Inno Setup kurulum)
        working-directory: kilit/skynav
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $rel = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "$rel\*" -DestinationPath "out\SkyNav-windows-$ver.zip"
          choco install innosetup -y --no-progress
          @"
          [Setup]
          AppName=SkyNav
          AppVersion=$ver
          AppPublisher=SkyNav
          DefaultDirName={autopf}\SkyNav
          DefaultGroupName=SkyNav
          OutputDir=out
          OutputBaseFilename=SkyNav-Setup-$ver
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\skynav.exe
          [Files]
          Source: "$rel\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{group}\SkyNav"; Filename: "{app}\skynav.exe"
          Name: "{userdesktop}\SkyNav"; Filename: "{app}\skynav.exe"
          [Run]
          Filename: "{app}\skynav.exe"; Description: "SkyNav'ı aç"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding UTF8 skynav.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" skynav.iss
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: skynav-windows
          path: kilit/skynav/out/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: skynav-windows-${{ github.run_number }}
          name: SkyNav Windows (${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: kilit/skynav/out/*
